<!DOCTYPE html>
<html>
<head>
  <title>Character Counter</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }

    textarea {
      width: 500px;
      height: 250px;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      resize: none;
    }

    textarea:focus {
      outline: none;
      border-color: #4CAF50;
    }

    #counter {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
</style>
</head>
<body>
  <h2 style="font-size: 50px;">Character Counter</h2>
  <textarea id="text" placeholder="Type here..."></textarea>
  <p id="counter">0 characters</p>

  <script>
    const textarea = document.querySelector('#text');
    const counter = document.querySelector('#counter');

    textarea.addEventListener('input', () => {
      counter.textContent = textarea.value.length + ' characters';
    });
  </script>

</body>
</html>
